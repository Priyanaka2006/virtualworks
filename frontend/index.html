<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualWorks - Quick Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>VirtualWorks</h1>

            <p class="subtitle">
                Write, save and manage your notes.
            </p>

            <textarea
                id="noteInput"
                placeholder="Write your note here..."
            ></textarea>

            <button id="saveButton">
                Save Note
            </button>

            <p id="message"></p>

            <h2>Saved Notes</h2>

            <div id="notesList">
                <p class="empty">Loading notes...</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
